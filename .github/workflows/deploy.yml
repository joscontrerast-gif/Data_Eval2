name: CI/CD MySQL Deploy

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # LOGIN EN DOCKER HUB
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BUILD IMAGE
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/innovatech-mysql .

      # PUSH IMAGE
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/innovatech-mysql

      # DEPLOY EN EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "🚀 Actualizando contenedor MySQL..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-mysql

            docker stop mysql-db || true
            docker rm mysql-db || true

            docker volume create mysql_data || true

            docker run -d \
              --name mysql-db \
              -p 3306:3306 \
              -v mysql_data:/var/lib/mysql \
              ${{ secrets.DOCKER_USERNAME }}/innovatech-mysql

            echo "✅ Deploy finalizado"
